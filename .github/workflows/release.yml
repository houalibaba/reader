name: Build and Release Reader

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install cross-compile toolchain & generate full 20,902 Unihan Pinyin table
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu python3-pip file binutils qemu-user
          pip3 install --break-system-packages pypinyin || pip3 install pypinyin
          python3 - << 'PYEOF'
          import json
          from pypinyin import pinyin, Style
          lines = [
              "package content",
              "",
              "func init() {",
              "\tfor ch, py := range unihanFullPinyinMap {",
              "\t\tif _, exists := SingleCharDict[ch]; !exists {",
              "\t\t\tSingleCharDict[ch] = struct{ Pinyin string; Poly bool }{Pinyin: py, Poly: false}",
              "\t\t}",
              "\t}",
              "}",
              "",
              "var unihanFullPinyinMap = map[string]string{",
          ]
          for cp in range(0x4E00, 0x9FA6):
              ch = chr(cp)
              res = pinyin(ch, style=Style.TONE, heteronym=False)
              if res and res[0] and res[0][0] != ch:
                  lines.append(f'\t{json.dumps(ch, ensure_ascii=False)}: {json.dumps(res[0][0], ensure_ascii=False)},')
          lines.append("}")
          with open("server/internal/content/unihan_full_gen.go", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("Generated unihan_full_gen.go covering all 20,902 CJK characters.")
          PYEOF

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(sed -n 's/^VERSION ?= //p' Makefile | head -n 1)"
            if [[ -z "${VERSION}" ]]; then
              echo "Could not read VERSION from Makefile" >&2
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Build web frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Tidy Go modules and run unit tests
        run: |
          cd server
          go mod tidy
          go test -v ./...

      - name: Build baseline x86-64 (Atom x5-Z8350 safe) & arm64 static binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -extldflags '-static' -X reader/server/internal/updater.CurrentVersion=${{ steps.version.outputs.version }}"
          AMD64_CFLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-bmi -mno-bmi2 -mno-fma -mno-lzcnt"
          cd server
          CFLAGS="" CXXFLAGS="" \
          GOAMD64=v1 CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc \
            CGO_CFLAGS="${AMD64_CFLAGS}" \
            CGO_LDFLAGS="-march=x86-64" \
            go build -trimpath -ldflags="${LDFLAGS}" \
            -o ../dist/reader-linux-amd64 ./cmd/reader
          CFLAGS="" CXXFLAGS="" \
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -trimpath -ldflags="${LDFLAGS}" \
            -o ../dist/reader-linux-arm64 ./cmd/reader
          cd ..
          file dist/reader-linux-amd64 dist/reader-linux-arm64
          # Verify on an SSE4.2-capable, pre-AVX CPU (compatible with Atom x5-Z8350; no AVX/BMI)
          qemu-x86_64 -cpu Nehalem-v1 ./dist/reader-linux-amd64 -version

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum reader-linux-amd64 reader-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Reader ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/reader-linux-amd64
            dist/reader-linux-arm64
            dist/checksums.txt
